[package]
name = "tpdf"
version = "26.7.0"
description = "Fast, lightweight PDF viewer and editor"
authors = ["tstone-1"]
edition = "2021"
rust-version = "1.85"
# The benchmark bins make `cargo run` ambiguous, and `tauri dev` shells out to a
# bare `cargo run`.
default-run = "tpdf"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "tpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF rendering and text extraction. Provisional until the Phase 0 spikes pass
# -- see AGENTS.md. `thread_safe` is a default feature and is left ON, but note it
# does NOT serialize calls behind a mutex despite what the crate README says: it
# only makes `Pdfium` Send + Sync and awaits the global bindings. Concurrent
# renders are undefined behaviour and crash (bin/thread_probe.rs). Parallelism
# comes from worker processes (spike 0.5), never from threads.
pdfium-render = "0.9"

# Low-level PDF object graph and content-stream operators.
lopdf = "0.44"

parking_lot = "0.12"
anyhow = "1"

# Tile encoding, for the encoded-vs-raw transfer A/B in spike 0.1.
png = "0.17"

# getrusage, for peak RSS in the tile bench. Pdfium allocates natively, so a
# Rust allocator hook would report almost nothing.
libc = "0.2"
tauri-plugin-dialog = "2.7.2"

[[bin]]
name = "tile-bench"
path = "src/bin/tile_bench.rs"

[[bin]]
name = "text-roundtrip"
path = "src/bin/text_roundtrip.rs"

[[bin]]
name = "remove-probe"
path = "src/bin/remove_probe.rs"

[[bin]]
name = "sanitize-rewrite"
path = "src/bin/sanitize_rewrite.rs"

[[bin]]
name = "worker-bench"
path = "src/bin/worker_bench.rs"

[[bin]]
name = "incremental-save"
path = "src/bin/incremental_save.rs"

[[bin]]
name = "thread-probe"
path = "src/bin/thread_probe.rs"

[[bin]]
name = "text-probe"
path = "src/bin/text_probe.rs"

[[bin]]
name = "progressive-probe"
path = "src/bin/progressive_probe.rs"
