[package]
name = "tpdf"
version = "26.7.0"
description = "Fast, lightweight PDF viewer and editor"
authors = ["tstone-1"]
edition = "2021"
rust-version = "1.85"
# The benchmark bins make `cargo run` ambiguous, and `tauri dev` shells out to a
# bare `cargo run`.
default-run = "tpdf"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "tpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF rendering and text extraction. Settled 2026-07-27 by spikes 0.1, 0.3 and 0.5:
# it renders, extracts and sandboxes correctly, and is not usable for redaction
# -- see AGENTS.md. `thread_safe` is a default feature and is left ON, but note it
# does NOT serialize calls behind a mutex despite what the crate README says: it
# only makes `Pdfium` Send + Sync and awaits the global bindings. Concurrent
# renders are undefined behaviour and crash (bin/thread_probe.rs). Parallelism
# comes from worker processes (spike 0.5), never from threads.
pdfium-render = "0.9"

# Low-level PDF object graph and content-stream operators.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
lopdf = "0.44"

parking_lot = "0.12"
anyhow = "1"

# Tile encoding, for the encoded-vs-raw transfer A/B in spike 0.1.
png = "0.17"

# getrusage, for peak RSS in the tile bench. Pdfium allocates natively, so a
# Rust allocator hook would report almost nothing.
libc = "0.2"
tauri-plugin-dialog = "2.7.2"

# The macOS print dialog. PDFKit paginates the document and builds the
# NSPrintOperation; AppKit supplies NSPrintInfo and runs the panel. `objc2`,
# `objc2-foundation` and `objc2-app-kit` are already in the tree transitively via
# Tauri, so only `objc2-pdf-kit` is genuinely new --- same crate family, same
# `Zlib OR Apache-2.0 OR MIT`, so no licensing question (AGENTS.md).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-pdf-kit = { version = "0.3", features = [
    "PDFDocument",
    "PDFPage",
    "objc2-app-kit",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNError", "std", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGImage", "CGDataProvider", "CGColorSpace", "std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFBase", "std"] }

# Windows containment, for `bin/win_sandbox_probe.rs`. macOS gets its boundary
# from `sandbox_init`, which has no counterpart here: job objects, integrity
# levels and restricted tokens are all Win32, so there is no version of this that
# avoids a direct dependency. `windows-sys 0.61` is already in the tree
# transitively (Tauri, and several build scripts), so this adds no crate at all
# --- and it is `MIT OR Apache-2.0`, checked with `cargo metadata` rather than
# assumed, because one copyleft crate anywhere removes the option of making this
# repository public (AGENTS.md).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Toolhelp: `backend-probe` reads its own module list and finds its worker
    # children through the OS process table, which are the observables its
    # claims rest on -- see `mapped_images` and `worker_pids` there.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    # `GetProcessMemoryInfo`, so `tile-bench` can report a peak on Windows
    # instead of the `NaN` that stands in for "not measurable here".
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # For `CommandLineToArgvW`, used by a test as an *independent* parser of the
    # command line `Worker::spawn_mapped` builds --- AGENTS.md records that a
    # writer and its own reader agree about output that is wrong.
    "Win32_UI_Shell",
] }

# The Windows print path, `print_win.rs`. Two things are needed that `windows-sys`
# structurally cannot give:
#
# * **WinRT.** `Windows.Data.Pdf` is the operating system's own PDF parser and
#   rasteriser --- the direct counterpart of PDFKit on macOS, and the one Windows
#   itself uses for PDF thumbnails and preview. `windows-sys` binds Win32 only, so
#   reaching it needs the projected `windows` crate and `windows-future` for the
#   async operations. It is the *independent* parser this repository's print
#   checks are built around: `lopdf` writes the job and PDFium drew what the reader
#   saw, so neither can say the output is readable by something else.
# * **GDI printing.** Windows has no in-box "print this PDF" API at any layer, so
#   the job is rasterised page by page onto a printer DC, which is what every
#   Windows PDF viewer does. `PrintDlg` for the panel, `StretchDIBits` for the page.
#
# Same licensing and no-new-crate argument as `windows-sys` above: `windows 0.61`
# is already in `Cargo.lock` transitively through Tauri's WebView2 stack, with
# `windows-future` and `windows-core` beside it, and it is `MIT OR Apache-2.0`.
windows = { version = "0.61", features = [
    # PdfDocument, PdfPage, PdfPageRenderOptions.
    "Data_Pdf",
    # Blocking on the WinRT async operations the loader returns.
    "Foundation",
    # `BitmapEncoder::BmpEncoderId`, which is the load-bearing choice here: asking
    # for BMP rather than the default PNG means the rendered page arrives as a DIB
    # that `StretchDIBits` accepts as-is, so the print path needs no image decoder
    # and gains no dependency for one.
    "Graphics_Imaging",
    # InMemoryRandomAccessStream and DataWriter, to get bytes in and out of WinRT.
    "Storage_Streams",
    "Win32_Foundation",
    # StretchDIBits, GetDeviceCaps, CreateDC, DeleteDC.
    "Win32_Graphics_Gdi",
    # StartDoc/StartPage/EndPage/EndDoc and DOCINFOW. Not in `Graphics_Gdi`, which
    # is where they read as though they belong: Windows files the document-level
    # printing calls under the XPS print stack even though they are the same
    # decades-old GDI escape sequences.
    "Win32_Storage_Xps",
    # Toolhelp, so `print-probe` can read its own module table and say which PDF
    # parser the printing process actually mapped -- see `boundary` there.
    "Win32_System_Diagnostics_ToolHelp",
    # PrintDlgW, and the CommDlg error code that distinguishes Cancel from failure.
    "Win32_UI_Controls_Dialogs",
] }
tauri-plugin-single-instance = "2.4.3"

