<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synthetic naturally wrapped text editing fixture</title>
<style>
  /* One ordinary paragraph wraps and overflows through the browser's layout.
     No line breaks, page breaks, spans or PDF post-processing supply the flow. */
  @page { size: 300pt 240pt; margin: 40pt 40pt 120pt; }
  body { margin: 0; font: 12pt Arial; }
  p { margin: 0; width: 140pt; line-height: 40pt; orphans: 1; widows: 1; }
</style>
<p>SYNTHETIC FIRST SYNTHETIC SECOND SYNTHETIC FIRST SYNTHETIC SECOND</p>
</html>
