<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synthetic text editing with painted rectangles</title>
<style>
  @page { size: 300pt 240pt; margin: 40pt; }
  body { margin: 0; font: 12pt Arial; }
  p { margin: 0 0 28pt; }
  p:first-of-type { background: #ddeeff; }
  .decoration { position: absolute; left: 0; top: 125pt; width: 200pt; height: 25pt; background: #99cc66; }
</style>
<p>SYNTHETIC FIRST</p>
<p>SYNTHETIC SECOND</p>
<div class="decoration" aria-hidden="true"></div>
</html>
