# cargo-audit configuration, read from `.cargo/audit.toml` under the directory
# `cargo audit` runs in -- so run it from the repository root and name the
# lockfile with `--file` (`.github/workflows/audit.yml` does both).
#
# Every warning is denied below, so an advisory that is not listed here fails
# the audit. Each entry is one the project has looked at and accepted, with the
# reason. Recorded 2026-09-26 against both lockfiles (`src-tauri/Cargo.lock`
# and `src-tauri/fuzz/Cargo.lock`), which carry the same set: the fuzz crate
# depends on `tpdf` by path, so every runtime dependency reaches both.
#
# Remove an entry when its crate leaves the tree: the audit does not complain
# about an ignore that matches nothing, so a stale entry is silent.

[advisories]
ignore = [
    # rsa 0.9: the Marvin attack, a timing side channel in *private-key*
    # operations (decryption and signing), with no fixed release. tpdf holds no
    # RSA private key anywhere: `integrity.rs` only verifies, in the worker,
    # which is a public-key operation the advisory does not cover. Revisited
    # 2026-09-26 with Phase 6 step 2 (signing): the shipped path signs in the
    # OS key store (`keystore.rs`), never in this crate. `rsa` does sign in the
    # test build --- `sign_cms/testkeys.rs`, with keys the tests generate ---
    # where a timing leak exposes nothing. The control is
    # `sign_cms::tests::no_private_key_type_is_named_outside_the_tests`, which
    # fails the day `RsaPrivateKey` is named in a shipped source file; that is
    # the day this entry is wrong. Since 2026-10-14 it allows ECDSA's
    # `SigningKey` in `pkcs12.rs`, which signs from a certificate file on
    # Linux with p256/p384 and refuses an RSA key (`pkcs12::Refusal::Rsa`). Recorded 2026-09-26, against both
    # lockfiles: the fuzz crate reaches `rsa` through its path dependency.
    "RUSTSEC-2023-0071",
    # ttf-parser: unmaintained (author statement, harfbuzz/ttf-parser#217); no
    # patched version exists. A direct dependency that reads embedded font
    # programs from documents, inside the worker only, after the program is
    # decoded under a 1 MiB bound. docs/DETAIL.md *Stack* has the bounds and the
    # replacement (`skrifa`) the advisory names.
    "RUSTSEC-2026-0192",
    # proc-macro-error: unmaintained. Under glib-macros -> glib -> gtk -> muda
    # -> tauri, the Linux GTK stack: `cargo tree -i proc-macro-error --target
    # aarch64-apple-darwin` and `--target x86_64-pc-windows-msvc` print nothing.
    "RUSTSEC-2024-0370",
    # glib 0.18: unsound `VariantStrIter`. The same Linux-only GTK path, absent
    # from both shipped targets by the same command.
    "RUSTSEC-2024-0429",
    # zip 4.6.1: three flaws in `ZipArchive::extract`, fixed only in zip 9 --
    # setuid and setgid bits kept (-0367), symbolic links whose targets leave
    # the destination (-0368), Unix permissions applied through symbolic links
    # (-0369). `tauri-plugin-updater` 2.13.3 and 2.14.0 require `zip ^4`, so
    # no lockfile can leave 4.6.1. The updater extracts only on Windows, in
    # `extract_zip`, after `verify_signature`, and only for a signed payload
    # that is a zip; tpdf's is a `-setup.exe`. docs/THREAT-MODEL.md §T9
    # residual 3. Recorded 2026-10-17; remove all three with the move to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zvariant, zbus_names, zvariant_derive: unmaintained as standalone crates,
    # merged into zbus 6.0.0 (2026-10-16). The advisories report no defect.
    # Linux only: `tauri-plugin-single-instance` 2.5.4, the newest, requires
    # `zbus ^5.9` for its D-Bus second-launch handoff, and `cargo tree -i
    # zvariant` prints nothing for aarch64-apple-darwin or
    # x86_64-pc-windows-msvc. Recorded 2026-10-17; remove all three when the
    # plugin moves to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[output]
# Unmaintained, unsound and yanked warnings fail the run, as vulnerabilities do.
# A yank has no id to list above, so `scripts/check_cargo_audit.py`, which CI
# runs instead of `cargo audit` directly, allows the yanked versions it names
# (none now; zip 4.6.1 for a few hours on 2026-10-16) and fails on every other
# warning.
deny = ["warnings"]
quiet = false
