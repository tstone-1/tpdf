name: Release

# Builds installers and publishes them to a GitHub Release.
#
# macOS is signed with a Developer ID identity and notarized by Apple, so it
# opens without a Gatekeeper bypass. Windows has no Authenticode certificate and
# is unsigned; SmartScreen warns on first launch.
#
# Signing is conditional on the Apple secrets being present, so a checkout
# without them still builds -- ad-hoc signed and unnotarized.
#
# Trigger by pushing a CalVer tag:
#   git tag v26.8.0 && git push origin v26.8.0
#
# ---------------------------------------------------------------------------
# THIS ALL RAN GREEN ON 2026-08-03, and this banner said the opposite of that
# until it did: "NOTHING BELOW THE WINDOWS LEG HAS EVER RUN". It was written on
# Windows from `screenpick`'s working release workflow, and every part of the
# Apple half -- the conditional export, the dylib signing, the DMG notarization,
# the verification -- was a claim until a tag was pushed.
#
# It took FOUR rehearsal tags, and each failed one step later than the last,
# which is the shape of running a sequence end to end for the first time rather
# than bad luck:
#
#   rc1  both gate legs red -- this job was copied from `ci.yml` and the copy
#        dropped the fixture-generation step, so a unit test needing
#        `rotated.pdf` failed here while passing in CI and locally.
#   rc2  gates green, Windows published, macOS died on `***: no identity found`
#        -- nothing had imported the certificate into a keychain yet, because
#        the Tauri CLI's own import happens two steps after the dylib signing.
#   rc3  the whole Apple path succeeded -- app notarized Accepted, DMG notarized
#        and stapled -- and then the step that VERIFIES it exited 127, because
#        `mapfile` is a bash 4 builtin and macOS runners give a `run:` block
#        bash 3.2. The release was fine; the checker could not run.
#   rc4  green, verification included.
#
# All three are in `docs/TRAPS.md`. The verification step at the end is written
# to FAIL rather than warn, because a skipped notarization exits 0 and produces
# an app Gatekeeper rejects on any machine that has never seen it, which is the
# "looks green" shape this repository spends most of its documentation on --
# and rc3 is the reminder that a verifier can fail for reasons of its own, so
# read its exit code before doubting its subject.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ACTION SUPPLY CHAIN. This job runs with `contents: write` and the six APPLE_*
# secrets in scope, so every action here executes beside the signing key and the
# App Store Connect key -- and `APPLE_API_KEY_P8` is the one credential in the
# portfolio Apple issues exactly once.
#
# A tag is not a version. It is a pointer its owner may repoint at any commit,
# so `@v0` grants that owner, and anyone who takes their account, the ability to
# run code in this job at a time of their choosing. Every action is therefore
# pinned by **commit SHA**, with the tag it was resolved from in the comment
# beside it. The comment is for humans; the SHA is the pin. To bump one, resolve
# the tag again -- `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` -- and
# check the SHA belongs to that repository before writing it down.
#
# The fork threat model in `ci.yml` covers the other direction (untrusted code
# arriving as a pull request). This is the direction it does not: trusted code
# arriving under a name that has not changed.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v[0-9][0-9].[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  # A tag on a broken commit must not produce artifacts. This runs
  # `scripts/gates.py` rather than restating its commands in YAML: that script
  # *is* the gate list, and AGENTS.md records that a hand-copied command quietly
  # loses a `--locked` or an `--all-targets` and then tests something weaker
  # than the real gate. Ask the script, never a second copy.
  gates:
    name: Gates (${{ matrix.platform }})
    # Narrower than the workflow's `contents: write`, which every job inherits
    # by default. This one only reads the tree and runs checks, and it installs
    # and executes third-party Python before the gates it exists to run --- so
    # handing it a token that can write to the repository is authority spent on
    # nothing. Write stays with `draft` and `release`, which create the release
    # and upload to it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          # The checkout leaves the repository token in `.git/config` unless
          # this is set, so every later step -- including the third-party
          # packages this job installs -- inherits a credential that can push.
          # Nothing here does any git operation beyond the checkout itself.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (v5.0.0)
        with:
          node-version: 24
          cache: npm

      # NOT `dtolnay/rust-toolchain@stable`, which installs whatever stable is
      # today and sets RUSTUP_TOOLCHAIN -- and that environment variable
      # overrides `rust-toolchain.toml` completely and silently. The pin would
      # then be present in the repository, absent from the build, and green
      # either way. `rustup show` installs exactly what the pin file names
      # (rustup ships on both runner images), so the file is the single source
      # of truth and the `toolchain` gate asserts the result.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (v2.9.1 + a changelog commit)
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      # `vendor/pdfium/` is gitignored -- the engine is fetched by digest, not
      # committed. The first gate is `fetch_pdfium.py --check`, which fails on a
      # missing or mismatched install, so this step is a prerequisite rather
      # than a convenience.
      - name: Install the pinned PDFium
        run: python scripts/fetch_pdfium.py

      # THIS STEP WAS MISSING UNTIL 2026-08-03, and the first tag ever pushed is
      # what found it. This job was written from `ci.yml` and the copy dropped
      # the fixture generation, so `print.rs`'s
      # `a_third_parser_checks_a_job_built_from_a_document_we_did_not_write` --
      # which needs `rotated.pdf` -- failed on both runners while passing in CI
      # and locally. The release gate was therefore weaker than the gate it
      # exists to satisfy, which is the exact rule `AGENTS.md` states about
      # hand-copied commands, with a whole step lost instead of a flag.
      #
      # It is the same one line as `ci.yml` now, and the list it generates lives
      # in `scripts/ci_fixtures.py` so there is nothing left to copy.
      # A pinned interpreter, so that `pip install` below has somewhere to
      # install to. The image's own `python` may be an externally-managed
      # Homebrew build, where PEP 668 refuses a plain `pip install` outright ---
      # and that would fail on one runner and not the other, which is the
      # platform-shaped failure this repository keeps writing traps about. It is
      # placed here rather than at the top so that every step above it keeps
      # using the interpreter it has been using.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 (v7.0.0)
        with:
          python-version: '3.13'

      # pyhanko writes the signed fixtures, and it is the one Python package a
      # gate run needs. Without it `make_incremental_pdf.py` produces nothing
      # signed and exits 0, so every test over a real signature would `[SKIP]`
      # and the run would look identical to one where they all passed --- the
      # failure this whole fixture step exists for. `ci_fixtures.py` turns that
      # into a hard error: it asserts each artifact exists after the generator
      # returns, proved both ways before this step was written.
      - name: Install pyhanko, for the signed fixtures
        run: python -m pip install --disable-pip-version-check -r scripts/fixture-tools.txt

      - name: Generate the test fixtures a runner can build
        run: python -u scripts/ci_fixtures.py --signed

      - name: Quality gates
        run: python -u scripts/gates.py

  # Creates the one draft release both build legs upload into, and hands them
  # its id.
  #
  # WHY THIS JOB EXISTS. `tauri-action` resolves the release itself when given a
  # `tagName`, and its own source says why that is fragile: *"you can't get an
  # existing draft by tag, so we must find one in the list of all releases"*. It
  # therefore pages `listReleases` looking for a matching `tag_name`. That lookup
  # succeeded for `26.8.2` -- its Windows leg logged `Found draft release with tag
  # v26.8.2 on the release list` -- and failed for both `26.8.3-rc2` and `-rc3`,
  # where neither leg logged `Found` and each created its own draft. The result
  # was **two drafts under one tag with the artifacts split**: one holding no
  # macOS updater bundle, the other no Windows installers, and each carrying a
  # `latest.json` naming a single platform. Publishing either ships a release
  # that installs and cannot update.
  #
  # Two plausible causes were written down and both were falsified -- a
  # single-job re-run (`rc3` had none and split identically) and a race between
  # the legs (`max-parallel: 1` was already set, and `rc3`'s two uploads were
  # eleven minutes apart). The workflow diff against `v26.8.2` is the release
  # body's wording and nothing else. **The cause is still open**, and this job is
  # written so that it does not matter: with `releaseId` set, `tauri-action`
  # takes the branch `if (tagName && !releaseId)` and never looks anything up.
  #
  # The merge that makes one release out of two legs is unaffected, and that was
  # checked in the action's source rather than assumed: before writing
  # `latest.json` it lists the release's assets, and when one is already there it
  # seeds `platforms` from it. So the second leg extends the first's manifest,
  # which is exactly how `26.8.2` ended with one 4,172-byte file naming both.
  draft:
    name: Draft release
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - name: Create the draft release, or adopt the one already there
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # GraphQL, not `gh api repos/.../releases`. That REST endpoint is what
          # the action's own lookup rests on and it is the thing under suspicion
          # here; it also answers HTTP 200 with `[]` under some tokens, so an
          # empty list from it is not evidence of an empty repository. GraphQL
          # returned the drafts every time this was checked by hand.
          #
          # RETRIED, because github.com's own availability is a real failure mode
          # of this workflow rather than a hypothetical one. In one afternoon it
          # produced a `429` that killed a macOS build while fetching an action
          # from codeload, and the `503` that killed `26.8.3-rc4` here --- on this
          # very call, at its first attempt. `-e` turned that into a correct
          # refusal and a lost release. Six attempts with a widening gap; a
          # genuine outage still fails, which is the point of bounding it.
          find_drafts() {
            local attempt out
            for attempt in 1 2 3 4 5 6; do
              if out=$(gh api graphql -f query='
                query($owner:String!, $name:String!) {
                  repository(owner:$owner, name:$name) {
                    releases(first: 30, orderBy: {field: CREATED_AT, direction: DESC}) {
                      nodes { databaseId tagName isDraft }
                    }
                  }
                }' -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
                --jq ".data.repository.releases.nodes[] | select(.tagName == \"$TAG\") | select(.isDraft) | .databaseId" 2>&1); then
                printf '%s' "$out"
                return 0
              fi
              echo "release lookup attempt $attempt failed: $out" >&2
              sleep $(( attempt * 5 ))
            done
            echo "::error::could not list releases after 6 attempts" >&2
            return 1
          }

          # The body is a literal here rather than read from CHANGELOG.md, so
          # that no tag can pick up a heading of the wrong shape -- BUILD.md's
          # versioning section has why. The cost is that it is only ever as
          # current as the last person who read it, which is why the release
          # checklist says to re-read it at the point it matters.
          cat > release-notes.md <<'NOTES'
          **What this is.** A PDF reader that has begun to edit: fast,
          sandboxed — every document is parsed and rendered in worker processes
          with no filesystem or network authority — with search, selection, an
          outline, thumbnails, session restore and printing.

          **What it edits.** Pages can be turned, deleted, moved, extracted to
          a second file, and cropped to what is actually printed on them — drag
          a thumbnail in the page strip, or use the command palette. Text you
          drag across can be highlighted, underlined, struck out or underlined
          with a squiggle; you can leave a comment anywhere on a page, draw a
          box, an ellipse or freehand ink on one, add a text box, stamp it
          APPROVED, CONFIDENTIAL, DRAFT or FINAL, and rub any of it out again
          with the eraser. A page can also be cropped by dragging out the part
          you want to keep. Marks take a colour you choose and each
          takes a note, and a sidebar panel lists every mark you have made. All
          of them are real annotations any PDF reader shows — `/Highlight`,
          `/Square`, `/Circle`, `/Ink`, `/FreeText` and the rest — rather than
          anything only tpdf can read. Everything is undoable, and the result is
          printed, written back into the file you opened with *Save*, or written
          out to a new file with *Save a copy*.

          **Documents behind a password.** An encrypted PDF opens: tpdf asks
          for the password and says so when it is wrong. A mark can be saved
          onto one, as an update appended to the end of the file, so it stays
          encrypted and every byte that was already there is untouched.
          Deleting, moving, rotating or cropping a page of one is refused,
          because those need the whole file rewritten and a rewrite would drop
          the encryption.

          **What it tells you about a document.** *Document properties*, in the
          palette and at the foot of the File menu, shows what a file says
          about itself: its title, author, producer and dates, its page count,
          size and PDF version, whether it is encrypted and which operations it
          permits, and any standard it claims to conform to. Where a document
          is signed, tpdf reads the signature and the certificate behind it —
          who signed, who issued that certificate, when, and whether a
          timestamp authority attested to it.

          **What it does not check.** Nothing about a signature is verified. No
          certificate chain is built, no issuer is trusted, no revocation is
          looked up, and the signature is never checked against the bytes it
          covers. What the dialog shows is what the document claims, and every
          row says so. The one thing tpdf does establish for itself is whether
          the signed byte range reaches the end of the file — a document signed
          and then appended to says so plainly.

          **What it is not, yet.** Signature verification, inserting pages,
          true redaction, forms and text editing are not built. See the
          roadmap in `docs/PLAN.md`.

          (Stamps were listed here until `26.8.8`, one release after they
          shipped. Nothing can go red for a stale sentence in this block --
          it is a literal in the workflow, deliberately, so that no tag can
          pick up a CHANGELOG heading of the wrong shape. The cost is that it
          is only ever as current as the last person who read it, which is why
          step 11 of the release checklist says to read it here.)

          **Which file to take.** macOS: the `.dmg`. Windows: the `.msi`, or
          the `-setup.exe` if you prefer an installer that asks fewer
          questions — either one installs the same application.

          **Updating.** tpdf checks for a newer version once per launch and
          offers it in the toolbar; nothing is downloaded or installed until
          you click. Every update is signed, and a copy
          already installed accepts only payloads signed with the key baked
          into it. The `.app.tar.gz`, `.sig` and `latest.json` files are how
          that works — you do not need to download them by hand.

          **macOS** — signed with a Developer ID identity and notarized by
          Apple. Open it normally; no Gatekeeper bypass needed. Apple Silicon only.

          **Windows** — unsigned. SmartScreen warns on first launch: choose
          *More info* → *Run anyway*.
          NOTES

          FOUND=$(find_drafts)
          COUNT=$(printf '%s' "$FOUND" | grep -c . || true)

          # Refused rather than resolved. More than one draft for this tag is the
          # exact state this job exists to prevent, and picking one of them is how
          # half a release gets published -- both look identical in `gh release
          # list`, down to the `createdAt`, which for a release is the tagged
          # commit's timestamp and not when the draft was made.
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::$COUNT drafts already exist for $TAG; delete them and re-tag"
            printf '%s\n' "$FOUND"
            exit 1
          fi

          if [ "$COUNT" -eq 1 ]; then
            # A re-run of this job, which must adopt rather than add.
            ID="$FOUND"
            echo "adopted the existing draft $ID for $TAG"
          else
            # A create is retried only when the SERVER says nothing landed, never
            # on the call's own exit code. That distinction is the whole design: a
            # create that reports failure may still have created --- the request
            # lands and the response is lost --- and a blind retry is exactly how
            # one tag ends up with the two drafts this job exists to prevent. So
            # every attempt is followed by a read-back, and the read-back decides:
            # one draft is the answer, none means it is safe to try again, more
            # than one is refused.
            #
            # rc6 is why this loops at all rather than trying once. github.com was
            # returning 503 to GraphQL *and* to the create that afternoon; the job
            # refused correctly and cost a release for a server that was fine
            # ninety seconds later. `gh release create` also prints a URL rather
            # than an id --- and for a draft that URL carries an `untagged-<hash>`
            # slug, not the tag --- so the id has to be read back regardless.
            ID=""
            for attempt in 1 2 3; do
              if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
                   --title "tpdf $TAG" --notes-file release-notes.md; then
                echo "create attempt $attempt reported a failure; asking the server what exists" >&2
              fi
              ID=$(find_drafts)
              COUNT=$(printf '%s' "$ID" | grep -c . || true)
              if [ "$COUNT" -gt 1 ]; then
                echo "::error::more than one draft exists for $TAG after create"
                printf '%s\n' "$ID"
                exit 1
              fi
              if [ "$COUNT" -eq 1 ]; then
                echo "created draft $ID for $TAG on attempt $attempt"
                break
              fi
              # Nothing landed, so nothing can be duplicated by trying again.
              ID=""
              echo "no draft exists for $TAG after attempt $attempt" >&2
              sleep $(( attempt * 10 ))
            done
            # An empty id reaching the build legs would silently restore the
            # behaviour this job removes, so it is a refusal rather than a warning.
            if [ -z "$ID" ]; then
              echo "::error::could not create a draft for $TAG in 3 attempts"
              exit 1
            fi
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"

          # The notes go out as an output too, and this is not decoration: the
          # action fills `latest.json`'s `notes` field from its `releaseBody`
          # input, so dropping that input emptied the manifest's notes --- caught
          # on rc5, where the file was 2,925 bytes against 26.8.2's 4,172 and the
          # only difference was those 0 bytes of text. Nothing in tpdf displays
          # them today (`update.ts` reads `version` and nothing else), so this
          # restores a field rather than a feature; a silent loss is still a loss,
          # and an updater UI that grows a notes panel would find it empty.
          #
          # Passing it as an output rather than repeating the prose keeps ONE
          # copy, which is why the heredoc moved above the lookup: both paths
          # through this job need the file now, not just the create.
          {
            echo "notes<<TPDF_NOTES_EOF"
            cat release-notes.md
            echo "TPDF_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.label }}
    needs: [gates, draft]
    strategy:
      fail-fast: false
      # SERIAL. Both legs upload to one GitHub Release, and the second reads the
      # first's `latest.json` off it to extend the manifest -- so if they
      # overlapped, the second could read a manifest the first had not finished
      # writing and drop its platform, with nothing failing to say so. screenpick
      # hit exactly that.
      #
      # This comment said "tpdf ships no updater today, so that exact failure
      # cannot occur here" until 2026-08-17. The updater landed in 26.8.2, five
      # days before that was noticed, and the sentence had been carrying its own
      # expiry condition in the next line: *"If an updater is ever added, this is
      # not optional any more."* It is not optional any more.
      #
      # It is also not sufficient, and that is the other half worth stating: this
      # was already set when 26.8.3-rc2 and -rc3 each produced two drafts eleven
      # minutes apart. Serialising the legs never addressed release *creation*,
      # which is what the `draft` job took away from them.
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon only, deliberately. `fetch_pdfium.py` installs one
          # architecture, so a universal build would need `mac-arm64` and
          # `mac-x64` fetched separately and `lipo`'d into a fat dylib -- and an
          # x86_64 slice of the app carrying an arm64-only PDFium would fail at
          # bind time on an Intel Mac, which nothing available here can test.
          # Both target machines are Apple Silicon.
          - platform: macos-latest
            label: macOS (Apple Silicon)
            bundle-dir: src-tauri/target/release/bundle
          - platform: windows-2025
            label: Windows (x64)
            bundle-dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (v5.0.0)
        with:
          node-version: 24
          cache: npm

      # NOT `dtolnay/rust-toolchain@stable`, which installs whatever stable is
      # today and sets RUSTUP_TOOLCHAIN -- and that environment variable
      # overrides `rust-toolchain.toml` completely and silently. The pin would
      # then be present in the repository, absent from the build, and green
      # either way. `rustup show` installs exactly what the pin file names
      # (rustup ships on both runner images), so the file is the single source
      # of truth and the `toolchain` gate asserts the result.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (v2.9.1 + a changelog commit)
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      - name: Install the pinned PDFium
        run: python scripts/fetch_pdfium.py

      # The vars go through $GITHUB_ENV rather than the build step's `env:`
      # block, and that is load-bearing rather than stylistic. With `env:`, a
      # checkout without the secrets hands the Tauri CLI an EMPTY
      # APPLE_SIGNING_IDENTITY, which it reads as "sign with this identity" and
      # fails on. Exporting conditionally leaves them genuinely unset, so the
      # CLI falls back to ad-hoc signing and the build still completes.
      #
      # The CLI imports the certificate itself from APPLE_CERTIFICATE and
      # APPLE_CERTIFICATE_PASSWORD and sets the key partition list, so codesign
      # never blocks on an interactive prompt inside ITS step.
      #
      # THAT SENTENCE ENDED "No manual keychain step" AND WAS WRONG ABOUT THIS
      # WORKFLOW, found by the second tag ever pushed (2026-08-03). It is a true
      # statement about the Tauri CLI and a false one about the job, because the
      # CLI's import happens inside `tauri-action` -- which runs AFTER the step
      # below that signs the vendored dylib. At that point no keychain on the
      # runner holds the identity, and `codesign` failed with the maximally
      # unhelpful `***: no identity found`, the `***` being the masked secret.
      # So the certificate is imported HERE, into a keychain that lives in
      # RUNNER_TEMP and dies with the runner, and the CLI is still handed the
      # same environment it expects and still does its own import for its own
      # signing.
      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Apple signing secrets absent - building ad-hoc signed and UNNOTARIZED."
            exit 0
          fi

          # notarytool wants the key as a file. RUNNER_TEMP goes with the
          # runner, so it does not outlive the job.
          KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS"
          KEYFILE="$KEYS/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # A keychain of our own, so the dylib step below has an identity to
          # sign with. RUNNER_TEMP dies with the runner, and the password is
          # generated here rather than stored -- nothing needs to reopen this.
          KEYCHAIN="$RUNNER_TEMP/tpdf-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -s "$KEYCHAIN"

          # macOS `base64` wants -D and GNU wants -d, and which one a runner
          # image ships has changed before. Try the portable spelling first and
          # fall back rather than pinning a flag that silently produces an empty
          # file -- an empty .p12 imports as "no identity" and lands us back at
          # the error this whole block exists to fix.
          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$CERT" 2>/dev/null \
            || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT"
          [ -s "$CERT" ] || { echo "::error::APPLE_CERTIFICATE did not decode to anything"; exit 1; }

          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Positive evidence the import produced something codesign can use,
          # counted rather than printed -- the identity's own name is a secret
          # here, so a printed line arrives masked and a number does not.
          #
          # `-v` is "valid identities only" and is deliberate: an identity that
          # does not chain to a trusted root cannot notarize, so catching it
          # here beats catching it forty minutes later at notarytool. Do not
          # drop the flag because a local rehearsal failed on it. A self-signed
          # certificate is `CSSMERR_TP_NOT_TRUSTED` by construction and can
          # never be valid, so a rehearsal against one is stricter than this
          # runner and its failure says nothing about this step -- which is
          # exactly what happened while writing it.
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -c "Developer ID Application" || true)
          echo "valid Developer ID Application identities in the build keychain: $IDENTITIES"
          if [ "$IDENTITIES" -lt 1 ]; then
            echo "::error::the certificate imported but yielded no VALID codesigning identity"
            # The unfiltered listing is the diagnosis: an identity present here
            # with CSSMERR_TP_NOT_TRUSTED means the .p12 carries the leaf
            # without its intermediate, and nothing at all means the import
            # itself did not take. The two want completely different fixes.
            security find-identity -p codesigning "$KEYCHAIN" || true
            exit 1
          fi

          # Heredoc for the certificate: base64 may arrive wrapped, and a
          # multi-line value breaks the plain KEY=VALUE form.
          {
            echo "APPLE_CERTIFICATE<<__TAURI_EOF__"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "__TAURI_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$KEYFILE"
          } >> "$GITHUB_ENV"
          echo "Apple signing enabled for this build."

      # tpdf bundles a native library and neither screenpick nor dblitz does, so
      # this step has no precedent to copy and is the one genuinely new part of
      # the Apple half.
      #
      # Notarization requires EVERY Mach-O in the bundle to carry a Developer ID
      # signature and the hardened runtime, `libpdfium.dylib` included. Whether
      # Tauri's bundler signs nested resources is not something this repository
      # has established. So the dylib is signed HERE, in `vendor/`, before the
      # bundler copies it -- which is correct either way: if the bundler re-signs
      # with `--deep` it overwrites this with the same identity, and if it does
      # not, the copy that lands in the app is already signed.
      - name: Sign the vendored PDFium
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          DYLIB=vendor/pdfium/lib/libpdfium.dylib
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" "$DYLIB"
          codesign -dv --verbose=4 "$DYLIB" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::vendored PDFium is not Developer ID signed"; exit 1; }
          codesign -dv --verbose=4 "$DYLIB" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::vendored PDFium lacks the hardened runtime"; exit 1; }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (action-v0.6.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update payloads with the minisign key whose public half is
          # pinned in `tauri.conf.json`. Nothing else can produce a payload an
          # installed tpdf will accept, and GitHub secrets cannot be read back
          # out -- if both of these are ever lost, no installed copy can be
          # updated again. `docs/THREAT-MODEL.md` §T9 carries what that means.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `createUpdaterArtifacts` lives in an overlay config rather than in
          # `tauri.conf.json`, and the reason is not tidiness. With it in the
          # main config, EVERY build demands `TAURI_SIGNING_PRIVATE_KEY` -- so a
          # plain `npm run tauri build` on a development machine fails with "A
          # public key has been found, but no private key", and the release
          # checklist's own bundle smoke-test cannot run without the signing key
          # sitting on that machine. Which would put the one secret that can
          # forge an update onto every laptop that builds. The overlay keeps
          # signing where the key is, and nowhere else. See the trap of that name.
          #
          # An ABSOLUTE path, and both halves of that are deliberate. A relative
          # one resolves against the invocation directory, which is this action's
          # and not the one a local `npm run tauri build` uses; and the obvious
          # alternative -- inline JSON -- does not survive the trip, because the
          # args string is split shell-style and a shell eats the JSON's double
          # quotes, leaving `{bundle:{createUpdaterArtifacts:true}}`. Checked
          # with `shlex.split`, not guessed. Either mistake would surface only on
          # a tag push, which is the most expensive place to find one.
          args: --config ${{ github.workspace }}/src-tauri/tauri.updater.conf.json
          # The draft is created once, by the `draft` job, and both legs upload
          # into it by id. `tagName` is deliberately absent: the action's create
          # path is guarded by `if (tagName && !releaseId)`, so passing both
          # would still take the `releaseId` branch, but leaving a `tagName` here
          # would read as though this job still resolves a release. It does not.
          # See the `draft` job for the two drafts this replaced.
          releaseId: ${{ needs.draft.outputs.id }}
          # NOT for creating a release --- `releaseId` above already takes that
          # branch away. This fills `latest.json`'s `notes` field, which the
          # action populates from this input, and which was empty on rc5 after
          # the create inputs were removed. Same text as the draft's body,
          # carried from the one heredoc that writes it rather than repeated.
          releaseBody: ${{ needs.draft.outputs.notes }}
          # Writes `latest.json` beside the payloads and uploads it. That file is
          # what an installed tpdf reads, through
          # `releases/latest/download/latest.json` -- a URL that resolves only to
          # a *published* release. The `draft` job creates this one as a draft, so
          # the file is invisible until somebody publishes it by hand, and that
          # act remains the one that offers the update to anybody.
          #
          # Both legs write this file and both upload it here. That is not a
          # conflict: before writing, the action lists the release's assets and
          # seeds `platforms` from a `latest.json` already there, so the second
          # leg extends the first's manifest rather than replacing it. Checked in
          # the action's source, and visible in `26.8.2`, whose single 4,172-byte
          # manifest names both platforms. It only holds while both legs upload to
          # ONE release, which is what the `draft` job now guarantees.
          includeUpdaterJson: true
          # `releaseName`, `releaseBody`, `releaseDraft` and `prerelease` used to
          # live here and are gone rather than merely inert. The action ignores
          # them once `releaseId` is set, so keeping them would leave the release
          # body written out in two places -- and a document with two accounts of
          # one fact is worse than one with none, because whichever a reader
          # reaches first wins. The body is in the `draft` job now, which is the
          # only thing that creates a release.

      # Tauri notarizes and staples the .app, then builds the DMG and only
      # SIGNS it. The DMG is left unnotarized and `spctl -a -t open` rejects it
      # as "Unnotarized Developer ID" -- and the DMG is what people download, so
      # opening it still produces "Apple cannot check it for malicious
      # software". Notarize and staple it too, then replace the asset
      # tauri-action already uploaded. The app inside is unaffected: it is
      # already stapled.
      - name: Notarize and staple the macOS DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls ${{ matrix.bundle-dir }}/dmg/*.dmg)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 \
            | grep -q "source=Notarized Developer ID" \
            || { echo "::error::DMG is still not notarized after stapling"; exit 1; }
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber \
            --repo "$GITHUB_REPOSITORY"

      # A skipped notarization does NOT fail the build: with credentials missing
      # or malformed the bundler logs "skipping app notarization" and exits 0.
      # Gate on the artifact so that cannot ship quietly.
      #
      # The dylib half also answers a question the code cannot: `PDFIUM_SUBDIR`'s
      # doc comment records that the macOS bundle layout for a resource map is
      # UNVERIFIED from a Mac. `find` locates it and prints the path, so the
      # first real run settles where macOS actually puts it.
      - name: Verify the macOS build is signed, notarized and stapled
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=$(ls -d ${{ matrix.bundle-dir }}/macos/*.app)
          echo "app: $APP"

          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::not signed with a Developer ID identity"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime missing - notarization cannot succeed"; exit 1; }
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Gatekeeper does not see this as notarized"; exit 1; }

          # The engine must be present, and be present exactly once. Zero means
          # the resource map did not survive into the bundle, which is the
          # defect fixed on 2026-07-31 and would ship an app that cannot open a
          # document at all.
          #
          # NO `mapfile` HERE. It is a bash 4 builtin, macOS ships bash 3.2 as
          # /bin/bash, and GitHub's `shell: bash` on a macOS runner is that
          # 3.2 -- so it exits 127 "command not found". Under `set -e` that
          # aborts the step with no message of its own, which is how this
          # verification failed on 2026-08-03 *after* the app and the DMG had
          # both notarized successfully: everything it checks was fine and the
          # checker could not run. Keep this loop portable.
          DYLIBS=()
          while IFS= read -r found; do
            DYLIBS+=("$found")
          done < <(find "$APP" -name 'libpdfium.dylib')
          echo "PDFium in the bundle at: ${DYLIBS[*]:-<none>}"
          [ "${#DYLIBS[@]}" -eq 1 ] \
            || { echo "::error::expected exactly one libpdfium.dylib, found ${#DYLIBS[@]}"; exit 1; }
          codesign -dv --verbose=4 "${DYLIBS[0]}" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::bundled PDFium is not Developer ID signed"; exit 1; }
          codesign -dv --verbose=4 "${DYLIBS[0]}" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::bundled PDFium lacks the hardened runtime"; exit 1; }

          echo "Verified: Developer ID signed, hardened, notarized, stapled, engine present."
