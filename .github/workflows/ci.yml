name: CI

# Runs the quality gates on every push to main and every pull request.
#
# This exists because the repository is public: macOS runner minutes bill at
# 10x against a private allowance and are free here, which is what changed. The
# original objection to having CI at all was not cost but duplication -- a
# workflow that restated the gate commands in YAML would be a second place for
# them to live, and one that quietly loses a `--locked` or an `--all-targets`
# and then gates something weaker than the real gate. That objection is
# answered the same way `release.yml` answers it: invoke `scripts/gates.py`,
# which *is* the gate list. Never restate its commands here.
#
# ---------------------------------------------------------------------------
# FORK THREAT MODEL. Public repositories accept pull requests from forks, and
# this workflow runs their code.
#
#   * `pull_request`, never `pull_request_target`. The latter runs with the
#     base repository's secrets and a writable token against the *fork's* code,
#     which is the standard way a public repository gets compromised.
#   * `permissions: contents: read`. Nothing here needs to write.
#   * NO SECRETS ARE REFERENCED. The six APPLE_* secrets survive the flip to
#     public -- GitHub does not expose repository secrets -- and they must stay
#     confined to `release.yml`, which triggers on a tag push and is therefore
#     unreachable from a fork.
#
# Keep that split. It is the whole of the fork threat model.
# ---------------------------------------------------------------------------
#
# WHAT THIS CANNOT COVER. `scripts/viewer_check.py` and `scripts/mutate_*.py`
# are not here and cannot be: the viewer harnesses drive a real window and need
# an unlocked, unoccluded screen, so on a headless runner they do not fail,
# they hang. The mutation harnesses rebuild per mutation and take minutes.
# Both stay local, and `BUILD.md` schedules them at release time.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # NOT `dtolnay/rust-toolchain@stable`, which installs whatever stable is
      # today and sets RUSTUP_TOOLCHAIN -- and that environment variable
      # overrides `rust-toolchain.toml` completely and silently. The pin would
      # then be present in the repository, absent from the build, and green
      # either way. `rustup show` installs exactly what the pin file names
      # (rustup ships on both runner images), so the file is the single source
      # of truth and the `toolchain` gate asserts the result.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci

      # `vendor/pdfium/` is gitignored -- the engine is fetched by digest, not
      # committed. The first gate is `fetch_pdfium.py --check`, which fails on a
      # missing or mismatched install, so this step is a prerequisite rather
      # than a convenience.
      - name: Install the pinned PDFium
        run: python scripts/fetch_pdfium.py

      # `testdata/*.pdf` is gitignored and generated, and several unit tests read
      # a fixture and `[SKIP]` when it is absent -- correctly, but a run where
      # every fixture is missing then looks exactly like a run where every one
      # passed. `print.rs` guards that with `assert!(examined > 0)`, so the very
      # first CI run went red here rather than quietly testing nothing. The
      # assertion was right; the workflow was incomplete.
      #
      # WHAT THIS DELIBERATELY DOES NOT GENERATE, so the gap is stated rather
      # than discovered:
      #   * anything from `make_text_pdf.py` (text-heavy, outline-hostile,
      #     hostile-filters) -- it needs fonttools and embeds a *system* font,
      #     which differs per runner and would make fixture-dependent assertions
      #     depend on the image.
      #   * `incr-scan-5p.pdf` -- `make_incremental_pdf.py` writes ~550 MB on
      #     purpose and needs pyhanko.
      # Tests wanting those still `[SKIP]` here and are covered locally, per
      # BUILD.md. These two are the dependency-free ones, and they cost 0.5 s.
      - name: Generate the dependency-free test fixtures
        run: |
          python testdata/make_rotated_pdf.py testdata
          python testdata/make_vector_pdf.py testdata/vector-multi.pdf 200000 12

      - name: Quality gates
        run: python -u scripts/gates.py
