name: Publish the Python client

# Builds `tpdf-client` from api/python and uploads it to PyPI.
#
# The client has its own version (api/python/pyproject.toml) and changes far
# less often than the application, so this is not part of release.yml. It is
# started by hand, from main only:
#   gh workflow run pypi.yml --ref main
#   gh run list --workflow pypi.yml --limit 1
#
# No password and no token is stored. PyPI trusts this workflow file in this
# repository, in the environment `pypi`, and gives it a token that is good for
# one upload ("trusted publishing"). The trust is set on pypi.org, under the
# project's Publishing settings.
#
# A version on PyPI cannot be replaced: an upload of a version that exists is
# refused, and the first job stops before anything is built when it does.

on:
  workflow_dispatch:

concurrency:
  group: pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Publish from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::started on $GITHUB_REF; the client is published from main only"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # 200 means the version is there, 404 that it is not. Anything else is no
      # answer, and no answer must not read as "free to upload".
      - name: Refuse a version PyPI already has
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('api/python/pyproject.toml','rb'))['project']['version'])")
          control=$(curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/pip/json)
          if [ "$control" != "200" ]; then
            echo "::error::PyPI answered $control for a package that exists, so it cannot be asked"
            exit 1
          fi
          answer=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/tpdf-client/$version/json")
          echo "tpdf-client $version on PyPI: HTTP $answer"
          if [ "$answer" = "200" ]; then
            echo "::error::tpdf-client $version is on PyPI already; raise the version in api/python/pyproject.toml"
            exit 1
          fi
          if [ "$answer" != "404" ]; then
            echo "::error::PyPI answered $answer, which is neither present nor absent"
            exit 1
          fi

      - name: Run the client's tests from the checkout
        run: python -m unittest discover -s api/python -p 'test_*.py'

      - name: Build
        run: uv build api/python --out-dir dist

      - name: Check the two archives
        run: |
          ls -la dist
          test "$(ls dist | wc -l)" -eq 2
          uvx twine check --strict dist/*

      # From another folder and without the checkout on the path, so the import
      # is the installed wheel and not api/python.
      - name: Import the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/tpdf_client-*.whl python -I -c "
          import pathlib, sys, tpdf_client
          origin = pathlib.Path(tpdf_client.__file__).resolve()
          print(origin)
          if 'api/python' in origin.as_posix():
              sys.exit('the import came from the checkout, not from the wheel')
          print(tpdf_client.Tpdf)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpdf-client
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The trust on pypi.org names this environment, so no other job and no
    # other workflow can get the upload token.
    environment:
      name: pypi
      url: https://pypi.org/p/tpdf-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tpdf-client
          path: dist

      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
