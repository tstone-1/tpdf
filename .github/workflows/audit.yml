name: Audit

# Checks every dependency against the RustSec and npm advisory databases.
#
# WHY IT IS A WORKFLOW AND NOT A GATE. `scripts/gates.py` must pass offline on a
# fresh checkout, and an advisory audit is a question about the world rather
# than about the commit: a lockfile that passed on Monday fails on Tuesday when
# an advisory is published, with no change to the repository. The weekly
# schedule is what catches that case; the push and pull-request triggers catch a
# dependency change that brings an advisory in with it.
#
# Until 2026-09-26 nothing ran an audit at all, and a direct dependency that
# parses fonts out of attacker-supplied documents (`ttf-parser`) was declared
# unmaintained on 2026-06-28 without anyone noticing. `.cargo/audit.toml` now
# denies every warning and lists, one reason each, the advisories this project
# has looked at and accepted -- so a new one is a red run, not a line in a log.
#
# FORK THREAT MODEL, as in `ci.yml`: `pull_request` and never
# `pull_request_target`, `permissions: contents: read`, no secrets referenced,
# and a checkout that does not persist its credential. Actions are pinned by
# commit SHA with the tag beside it; see `ci.yml` for how to bump one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC, off the hour so it is not queued behind every other
    # scheduled workflow on GitHub.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      rehearse:
        description: Check a copy of the PDFium pin set back to 8066, start the build and open an issue marked as a rehearsal
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    # Linux, because the audit reads lockfiles and builds nothing for a target;
    # the advisories it reports are the same on every runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (v5.0.0)
        with:
          node-version: 24

      # `rustup show` for the reason `ci.yml` gives: it installs what
      # `rust-toolchain.toml` names instead of setting RUSTUP_TOOLCHAIN.
      - name: Install the pinned Rust toolchain
        run: rustup show

      # Pinned to a version, and `--locked` so its own dependencies are the
      # ones its release was built with. Bump it deliberately, like the toolchain.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # From the repository root, because cargo-audit reads `.cargo/audit.toml`
      # under the directory it runs in; the script names each lockfile with
      # `--file`. The fuzz package has its own lockfile and resolves the
      # application by path, so it can hold a version the application's
      # lockfile does not. The script, not `cargo audit` itself, because a
      # yanked crate has no advisory id to ignore: it lets through exactly the
      # yanked versions it names, with the reason (none now; `zip` 4.6.1 for a few
      # hours on 2026-10-16, until it was unyanked). It also audits each lockfile
      # without `.cargo/audit.toml` and fails on an ignore neither lockfile needs.
      - name: The audit filter, offline
        run: python3 scripts/check_cargo_audit.py --self-test

      - name: cargo audit (application and fuzz package)
        run: python3 scripts/check_cargo_audit.py src-tauri/Cargo.lock src-tauri/fuzz/Cargo.lock

      # The lockfile is enough; nothing needs installing. `--omit=dev` because
      # the development tree never reaches the shipped webview bundle.
      - name: npm audit
        run: npm audit --omit=dev

  pdfium:
    name: PDFium pin against Chrome stable
    # The same kind of question as the audit above: whether the pinned engine
    # is still the one Chrome ships changes when upstream moves, not when this
    # repository does. `scripts/check_pdfium_age.py` has the account. A source
    # that does not answer is a red run, because "could not ask" is not
    # "current".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.age.outputs.version }}
      pdfium: ${{ steps.age.outputs.pdfium }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          persist-credentials: false

      - name: The reading and the rule, offline
        run: python3 scripts/check_pdfium_age.py --self-test

      # A rehearsal asks the same question about a copy of the pin that is
      # known to be behind: 8066, the pin until 2026-10-10. It is how the path
      # from a stale pin to an issue is shown to work while the real pin is
      # current. The repository's file is not changed.
      - name: The pin against Chrome stable and its own branch
        id: age
        env:
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          pins=scripts/pdfium_build.json
          if [ "$REHEARSE" = true ]; then
            pins="$RUNNER_TEMP/pdfium_build.json"
            cp scripts/pdfium_build.json "$pins"
            python3 scripts/check_pdfium_age.py --pins "$pins" --repin 8066-tpdf.1 fc46361ce75055cd549cb938fae5d6a3fe3a1a05
          fi
          python3 scripts/check_pdfium_age.py --pins "$pins" --output "$GITHUB_OUTPUT"

  # What a dependency bot does for a package, for an engine no bot knows: when
  # the job above found the pin behind, start the build of what it proposes and
  # open one issue for it. The job above stays red, and stays read-only; this
  # one holds the two write permissions and runs no code from the checkout,
  # only `gh` with a version and a commit that the script above matched against
  # their patterns before it wrote them.
  #
  # One issue per proposal: the title names the version and the commit, and a
  # run that finds an open issue with that title does nothing, so the weekly
  # run and every push in between do not build again. A pull request never
  # reaches here, and from a fork its token could write nothing.
  pdfium-bump:
    name: PDFium build and issue for a stale pin
    needs: pdfium
    if: always() && needs.pdfium.outputs.version != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.pdfium.outputs.version }}
      PDFIUM: ${{ needs.pdfium.outputs.pdfium }}
      REHEARSE: ${{ inputs.rehearse }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Start the candidate build and open the issue
        run: |
          set -euo pipefail
          title="PDFium: build $VERSION at ${PDFIUM:0:12}"
          if [ "$REHEARSE" = true ]; then title="Rehearsal, nothing to do: $title"; fi
          # Read first and searched after: `grep -q` stops at the first match,
          # and under pipefail a `gh` cut short would read as no match.
          open=$(gh issue list --state open --limit 200 --json title --jq '.[].title')
          if grep -Fxq "$title" <<< "$open"; then
            echo "an open issue already has the title: $title"
            exit 0
          fi
          gh workflow run pdfium.yml --ref "$GITHUB_REF_NAME" -f version="$VERSION" -f pdfium="$PDFIUM"
          build="The candidate build was started: [runs of the PDFium workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/pdfium.yml). It builds this version without changing the pin of the repository, and writes its result here as a comment when it ends."
          if [ "$REHEARSE" = true ]; then
            build="$build This run was a rehearsal against a copy of the pin set back to 8066, so the build is of a version that exists and its result is needed for nothing."
          fi
          {
            echo "The pinned PDFium is behind what Chrome stable ships. [The run that found it]($RUN_URL) has the two findings."
            echo
            echo "- Version to build: \`$VERSION\`"
            echo "- Commit: [\`$PDFIUM\`](https://pdfium.googlesource.com/pdfium/+/$PDFIUM)"
            echo
            echo "$build"
            echo
            echo "What is left for a person, as \`BUILD.md\` describes it: write the two values into \`scripts/pdfium_build.json\`, publish the archives of the candidate build as the prerelease \`pdfium-$VERSION\`, pin their digests in \`scripts/fetch_pdfium.py\`, run the compatibility probes, and release."
            echo
            echo "The \`Audit\` workflow stays red until the pin is current, and a release is not published while it is red."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
