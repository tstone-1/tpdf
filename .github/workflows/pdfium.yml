name: PDFium candidate

# Explicit dependency build, independent of application releases. Untrusted
# source builds receive a read-only token and no signing credentials. Artifacts
# are candidates: producing one does not publish it or update the production pin.
#
# Started by hand, or by `audit.yml` when the pin is behind, with a version and
# a commit: the build then uses those two in place of the ones in
# `scripts/pdfium_build.json`, in its own checkout and nowhere else.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Build this version, <branch>-tpdf.<n>, not the pinned one (with pdfium)
        required: false
      pdfium:
        description: The PDFium commit of that version, 40 digits
        required: false
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - '.github/workflows/pdfium.yml'
      - 'scripts/build_pdfium.py'
      - 'scripts/pdfium*'
      - 'scripts/test_pdfium_build.py'
      - 'testdata/make_rtl_pdf.py'
      - 'testdata/make_multilingual_pdf.py'
      - 'testdata/make_text_pdf.py'
  pull_request:
    paths:
      - 'LICENSE'
      - '.github/workflows/pdfium.yml'
      - 'scripts/build_pdfium.py'
      - 'scripts/pdfium*'
      - 'scripts/test_pdfium_build.py'
      - 'testdata/make_rtl_pdf.py'
      - 'testdata/make_multilingual_pdf.py'
      - 'testdata/make_text_pdf.py'

permissions:
  contents: read

concurrency:
  group: pdfium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
            extra: ''
          - runner: windows-2025
            platform: win-x64
            extra: '--install-windows-sdk'
          - runner: ubuntu-24.04
            platform: linux-x64
            extra: '--install-linux-deps'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Through the environment and through the script's own patterns, so that
      # what was typed into the form is never part of a command.
      - name: Build another version than the pinned one
        if: inputs.version != '' || inputs.pdfium != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PDFIUM: ${{ inputs.pdfium }}
        run: python scripts/check_pdfium_age.py --repin "$VERSION" "$PDFIUM"
      - name: Verify build safeguards
        run: python -m unittest discover -s scripts -p test_pdfium_build.py
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Build, verify, package
        shell: bash
        env:
          PDFIUM_WORK: ${{ runner.temp }}/pdfium-build
          PDFIUM_ARTIFACTS: ${{ runner.temp }}/pdfium-artifacts
        run: |
          set -euo pipefail
          uv run --python 3.13 --with-requirements scripts/pdfium-fixture-tools.txt \
            scripts/build_pdfium.py --work "$PDFIUM_WORK" --output "$PDFIUM_ARTIFACTS" ${{ matrix.extra }}
      - name: Upload verified candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-${{ matrix.platform }}
          path: ${{ runner.temp }}/pdfium-artifacts/
          if-no-files-found: error
          retention-days: 30

  # The candidate's result, in the issue that asked for it. `audit.yml`'s
  # `pdfium-bump` starts this build and opens the issue, and that job is green
  # as soon as both are done. So until 2026-10-23 a build that failed said so
  # only on this workflow's page: the 8103 candidate failed on all three
  # platforms while issue #5 read as if it were still building. Like
  # `pdfium-bump`, this runs no code from a checkout, only `gh` and `jq` with
  # the two inputs, matched against their patterns first. The title is the one
  # `pdfium-bump` writes, and `scripts/check_workflow_parity.py` holds the two
  # lines that build it equal.
  report:
    name: Result in the issue
    needs: build
    if: always() && github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      PDFIUM: ${{ inputs.pdfium }}
      RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the issue for this version and commit
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+-tpdf\.[0-9]+$ && "$PDFIUM" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[FAIL] the inputs are not a version and a 40-digit commit, so no issue can name them"
            exit 1
          fi
          title="PDFium: build $VERSION at ${PDFIUM:0:12}"
          jobs=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '.jobs[] | select(.name != "Result in the issue") | "- \(.name): \(.conclusion)"')
          if [ -z "$jobs" ]; then
            echo "[FAIL] the run lists no build job, so there is no result to report"
            exit 1
          fi
          if [ "$RESULT" = success ]; then
            verdict="The candidate build passed on every platform: [the run]($RUN_URL). Its archives are that run's artifacts, kept for 30 days."
          else
            verdict="**The candidate build did not pass** (\`$RESULT\`): [the run]($RUN_URL). Nothing from it can be published or pinned; the failing step's log is in the run."
          fi
          printf '%s\n\n%s\n' "$verdict" "$jobs" > "$RUNNER_TEMP/result.md"
          cat "$RUNNER_TEMP/result.md"
          # Read first and searched after, as in `pdfium-bump`: a listing cut
          # short must not read as "no issue".
          issues=$(gh issue list --state open --limit 200 --json number,title)
          number=$(jq -r --arg t "$title" --arg r "Rehearsal, nothing to do: $title" \
            '[.[] | select(.title == $t or .title == $r) | .number] | first // empty' <<< "$issues")
          if [ -z "$number" ]; then
            echo "no open issue is titled: $title -- the result above is this run's only report"
            exit 0
          fi
          gh issue comment "$number" --body-file "$RUNNER_TEMP/result.md"
